---
# AutoClearLagg (ACL) Config

# Positive number of seconds between cleanup passes
seconds: 300

# Entities to clear
clear:
  items: true
  mobs: true
  xp-orbs: true
  exempt: # Array of entities not to clear
    - Zombie
    - Pig

messages:
  time-left: "§cEntities will clear in {SECONDS} seconds"
  entities-cleared: "§cCleared a total of {COUNT} entities"

# Positive countdown seconds to broadcast before a cleanup pass
times: [60, 30, 15, 10, 5, 4, 3, 2, 1]
...
